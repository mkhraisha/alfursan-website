name: CI

on:
  # Any base branch — needed so stacked PRs (feature branches opened against
  # another feature branch, not yet against main) get CI too.
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Build, unit tests & e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Dummy — never actually sent; only presence is checked at build/runtime.
      RESEND_API_KEY: ci_dummy_key
      RESEND_FROM_ADDRESS: noreply@example.test
      RESEND_DEALER_EMAIL: dealer@example.test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Start local Supabase stack
        run: supabase start -x studio,edge-runtime,logflare,vector,imgproxy,supavisor

      - name: Apply migrations to local stack
        run: supabase db reset

      - name: Export local Supabase connection details
        run: |
          supabase status -o env \
            | grep -E '^(API_URL|PUBLISHABLE_KEY|SECRET_KEY)=' \
            | sed \
                -e 's/^API_URL=/SUPABASE_URL=/' \
                -e 's/^PUBLISHABLE_KEY=/SUPABASE_PUBLISHABLE_KEY=/' \
                -e 's/^SECRET_KEY=/SUPABASE_SECRET_KEY=/' \
                -e 's/^\([A-Z_]*\)="\(.*\)"$/\1=\2/' \
            >> "$GITHUB_ENV"

      - name: Seed e2e test users (manager/sales) and export their tokens
        run: node scripts/e2e-seed-test-users.mjs

      - name: Seed e2e fixture vehicle (for public listing suite)
        run: node scripts/e2e-seed-test-vehicle.mjs

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start dev server
        run: |
          npm run dev > dev-server.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -sf http://localhost:4321/ >/dev/null 2>&1 && exit 0
            sleep 1
          done
          echo "Dev server did not become ready in time" >&2
          cat dev-server.log >&2
          exit 1

      - name: E2E tests
        run: npx playwright test

      - name: Upload dev server log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dev-server-log-${{ github.run_id }}
          path: dev-server.log
          retention-days: 7

      - name: Upload Playwright report (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 14

      - name: Upload Playwright report (Pages)
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: playwright-report/

  publish-report:
    name: Publish latest E2E report to GitHub Pages
    if: always() && needs.test.result != 'cancelled' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
